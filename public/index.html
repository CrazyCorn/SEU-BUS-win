<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园接驳车时刻表</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app-container">
        <!-- 头部：新增Logo和基本的Flex布局来对齐元素 -->
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <!-- Logo 和标题的容器 -->
            <div style="display: flex; align-items: center; gap: 10px;">
                <!-- 东南大学 Logo -->
                <img src="./school.svg" alt="东南大学校徽" class="school-logo" style="height: 40px; width: auto; object-fit: contain;">
                <h1>校园接驳车实时查询</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <!-- 邮件提醒按钮 -->
                <button id="email-reminder-btn" class="icon-btn" title="设置邮件提醒">
                    📧
                </button>
                <div class="time-display">
                    <div id="date-display"></div>
                    <div id="weekday-display"></div>
                    <div id="clock">--:--:--</div>
                </div>
            </div>
        </header>

        <div id="scroll-content">
            <div class="controls">
            <div class="control-group">
                <label for="mode-toggle">选择查询模式：</label>
                <div class="toggle-switch mode-switch">
                    <input type="radio" id="mode-realtime" name="mode" value="realtime" checked>
                    <label for="mode-realtime">按起点查询</label>
                    <input type="radio" id="mode-destination" name="mode" value="destination">
                    <label for="mode-destination">按终点查询</label>
                    <input type="radio" id="mode-all" name="mode" value="all">
                    <label for="mode-all">时刻表查询</label>
                </div>
            </div>

            <div class="control-group">
                <label for="day-type">选择日期类型：</label>
                <div class="toggle-switch">
                    <input type="radio" id="workday" name="day-type" value="workday" checked>
                    <label for="workday">工作日</label>
                    <input type="radio" id="holiday" name="day-type" value="holiday">
                    <label for="holiday">节假日</label>
                </div>
            </div>

            <div class="control-group">
                <label for="date-range">选择查看日期：</label>
                <div class="toggle-switch">
                    <input type="radio" id="date-today" name="date-range" value="today" checked>
                    <label for="date-today">今日</label>
                    <input type="radio" id="date-tomorrow" name="date-range" value="tomorrow">
                    <label for="date-tomorrow">明日</label>
                </div>
            </div>

            <div id="realtime-controls">
                <div class="control-group">
                    <label for="location-select">选择你的上车地点：</label>
                    <select id="location-select">
                    </select>
                </div>
            </div>

            <div id="destination-controls" style="display:none;">
                <div class="control-group">
                    <label for="destination-select">选择你的终点站：</label>
                    <select id="destination-select">
                        <option value="">请选择终点</option>
                    </select>
                </div>
            </div>
            </div>

            <div id="results">
                <h2>接下来的班车：</h2>
                <div id="bus-card-1" class="bus-card no-bus">
                    请先选择查询模式和地点
                </div>
                <div id="bus-card-2" class="bus-card" style="display:none;">
                </div>
            </div>

            <div id="all-schedules-container">
                <div id="all-schedules-controls" style="margin-bottom: 20px;">
                    <label for="all-location-select" style="font-weight: bold;">选择起点：</label>
                    <select id="all-location-select"></select>
                </div>
                <div id="schedules-content"></div>
            </div>
        </div>

        

        
    </div>

    <!-- 邮件提醒弹窗 -->
    <div id="email-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📧 设置邮件提醒</h2>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="email-reminder-form">
                    <div class="form-group">
                        <label for="user-email">邮箱地址：</label>
                        <input type="email" id="user-email" placeholder="请输入您的邮箱" required>
                    </div>

                    <div class="form-group">
                        <label for="reminder-day-type">日期类型：</label>
                        <select id="reminder-day-type" required>
                            <option value="workday">工作日</option>
                            <option value="holiday">节假日</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="reminder-location">上车地点：</label>
                        <select id="reminder-location" required>
                            <option value="">请选择地点</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="reminder-time">班车时间：</label>
                        <select id="reminder-time" required>
                            <option value="">请先选择地点</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="reminder-destination">目的地：</label>
                        <input type="text" id="reminder-destination" readonly>
                    </div>

                    <div class="form-group">
                        <label for="reminder-advance">提前提醒（分钟）：</label>
                        <select id="reminder-advance" required>
                            <option value="5">5分钟</option>
                            <option value="10" selected>10分钟</option>
                            <option value="15">15分钟</option>
                            <option value="20">20分钟</option>
                            <option value="30">30分钟</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">添加提醒</button>
                        <button type="button" class="btn-secondary" id="modal-cancel-btn">取消</button>
                    </div>
                </form>

                <div id="subscription-status" class="status-message" style="display: none;"></div>

                <!-- 已订阅列表 -->
                <div id="subscriptions-list" class="subscriptions-container">
                    <h3>我的订阅</h3>
                    <div id="subscriptions-content">
                        <p class="no-subscriptions">暂无订阅</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
